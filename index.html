<!DOCTYPE html>
<html>
<head>
    <title>신입생을 위한 외대 밥집 찾기 서비스</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="sidebar">
        <h1>신입생을 위한 외대 밥집 찾기 서비스</h1>
        
        <div id="category-filters">
            <h2>필터링:</h2>
            <div class="filter-buttons">
                <button class="filter-btn active" data-category="전체">전체</button>
                <button class="filter-btn" data-category="한식">한식</button>
                <button class="filter-btn" data-category="일식">일식</button>
                <button class="filter-btn" data-category="중식">중식</button>
                <button class="filter-btn" data-category="양식">양식</button>
                <button class="filter-btn" data-category="기타">기타</button>
                <button class="filter-btn" data-category="고기 / 회식">고기 / 회식</button>
            </div>
        </div>
        
        <div id="restaurant-list"></div>
        
        <div id="review-form-area">
            <hr>
            <h2>✍️ AI 데이터 기여하기</h2>
            <p>여러분의 솔직한 리뷰가 AI 추천 랭킹을 업데이트합니다.</p>
            <form id="review-form">
                <select name="restaurantName" id="review-restaurant-name" required>
                    <option value="">식당 선택</option>
                </select>
                <input type="number" name="rating" min="1" max="5" placeholder="별점 (1~5)" required>
                <textarea name="reviewText" placeholder="솔직한 리뷰를 남겨주세요." required></textarea>
                <button type="submit">리뷰 제출 (AI 데이터 반영)</button>
            </form>
            <p id="submit-message" style="color: green; font-weight: bold;"></p>
        </div>
        
    </div>
    
    <div id="map"></div>

    <script type="text/javascript" 
        src="//dapi.kakao.com/v2/maps/sdk.js?appkey=a780b87271a6037a71c21ccf11fd2389&libraries=services"></script>
    
    <script src="script.js"></script>
</body>
</html>
